[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "email-mcp"
version = "0.2.0"
description = "Multi-account Gmail and IMAP/SMTP MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-api-python-client==2.200.0",
  "google-auth-oauthlib==1.4.1",
  "mcp==2.2.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
email-mcp = "email_mcp.server:main"
email-auth = "email_mcp.auth:main"
email-config-check = "email_mcp.diagnostics:main"
email-store-password = "email_mcp.password:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
