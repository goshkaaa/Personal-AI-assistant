[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-userbot-mcp"
version = "0.1.0"
description = "Telegram userbot MCP server and conversation worker"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp==2.2.0",
  "pyrogrammod==2.4.1",
  "tgcrypto==1.2.5",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
telegram-mcp = "telegram_mcp.app:main"
telegram-listener = "telegram_mcp.listener:main"
telegram-worker = "telegram_mcp.tasks.worker:main"
telegram-notifier = "telegram_mcp.tasks.notifications:main"
telegram-login = "telegram_mcp.cli:login_main"
telegram-listener-login = "telegram_mcp.cli:listener_login_main"
telegram-smoke = "telegram_mcp.cli:smoke_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
