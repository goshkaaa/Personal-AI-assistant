[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-calendar-mcp"
version = "0.1.0"
description = "Apple iCloud Calendar MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "caldav==3.3.1",
  "icalendar==6.3.2",
  "mcp==2.2.0",
  "niquests==3.21.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
calendar-mcp = "calendar_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
