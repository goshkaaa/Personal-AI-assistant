[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "calendar-mcp"
version = "0.2.0"
description = "Multi-account Google Calendar and CalDAV MCP server"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "caldav==3.3.1",
  "google-api-python-client==2.200.0",
  "google-auth-oauthlib==1.4.1",
  "icalendar==6.3.2",
  "mcp==2.2.0",
  "niquests==3.21.2",
]

[project.optional-dependencies]
dev = ["ruff>=0.15,<0.16"]

[project.scripts]
calendar-mcp = "calendar_mcp.server:main"
calendar-auth = "calendar_mcp.auth:main"
calendar-config-check = "calendar_mcp.diagnostics:main"
calendar-store-password = "calendar_mcp.password:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM"]
