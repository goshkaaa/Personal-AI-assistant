name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install MCP modules
        run: |
          for service in calendar gmail homeassistant obsidian telegram; do
            uv sync --project "mcp/$service" --locked --extra dev --no-editable
          done

      - name: Check
        run: make check

      - name: Generate config
        run: make config
